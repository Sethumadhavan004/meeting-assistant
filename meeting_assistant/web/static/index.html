<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Assistant</title>
<style>
  /* Geist, stored in the app: a privacy tool should not fetch fonts from a CDN */
  @font-face { font-family: "Geist"; src: url(/static/fonts/geist-latin.woff2) format("woff2");
               font-weight: 100 900; font-display: swap; }

  /* Monochrome. The highlight is the ink itself: black on white, white on black. */
  :root {
    --bg: #f4f4f4; --panel: #ffffff; --soft: #f0f0f0; --line: #e4e4e4; --line-2: #c9c9c9;
    --ink: #000000; --ink-2: #4d4d4d; --muted: #8c8c8c;
    --hi: #000000; --hi-ink: #ffffff;
    --rec: #e5484d;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --panel: #0c0c0c; --soft: #1a1a1a; --line: #242424; --line-2: #3d3d3d;
      --ink: #ffffff; --ink-2: #b3b3b3; --muted: #737373;
      --hi: #ffffff; --hi-ink: #000000;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --panel: #0c0c0c; --soft: #1a1a1a; --line: #242424; --line-2: #3d3d3d;
    --ink: #ffffff; --ink-2: #b3b3b3; --muted: #737373;
    --hi: #ffffff; --hi-ink: #000000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Geist", system-ui, "Segoe UI", sans-serif; font-feature-settings: "ss01";
         -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 28px; }
  .control { min-width: 0; max-width: 100%; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .mark { width: 30px; height: 30px; border-radius: 50%; background: var(--hi); display: grid; place-items: center; }
  .mark i { width: 10px; height: 10px; border-radius: 50%; background: var(--hi-ink); }
  .brand h1 { font-size: 17px; font-weight: 640; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .control { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px;
             border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13.5px; }
  .control select { border: 0; background: transparent; height: 100%; padding-right: 6px; cursor: pointer; max-width: 46vw; }
  .control select:focus-visible { outline: none; }
  .control:focus-within { border-color: var(--ink); }
  .status { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
  .status.ok { background: var(--ink); border-color: var(--ink); }
  .status.down { background: transparent; border-color: var(--rec); }
  .theme { display: flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
  .theme button { border: 0; background: none; border-radius: 999px; padding: 4px 11px; font-size: 13px;
                  color: var(--ink-2); cursor: pointer; }
  .theme button[aria-pressed="true"] { background: var(--hi); color: var(--hi-ink); }

  /* ---------- layout ---------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
         gap: 16px; padding: 0 28px 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
           display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 20px 22px 0; }
  .panel-head h2 { font-size: 20px; font-weight: 620; letter-spacing: -.025em; margin: 0; }
  .panel-head .aside { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 14px; align-items: center; }
  .rec-clock { display: none; align-items: center; gap: 7px; color: var(--ink); font-weight: 560; }
  .rec-clock::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); animation: blink 1.2s infinite; }
  .recording .rec-clock { display: inline-flex; }
  @keyframes blink { 50% { opacity: .2; } }

  /* ---------- the speaker bar: the one loud thing ---------- */
  .speakers { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 22px 6px; }
  .speaker { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px;
             border: 1px solid var(--line-2); border-radius: 999px; background: var(--panel); cursor: pointer;
             font-weight: 520; transition: background .15s, color .15s, border-color .15s; }
  .speaker:hover { border-color: var(--ink); }
  .speaker .meter { display: none; align-items: center; gap: 2px; height: 16px; }
  .speaker .meter b { width: 3px; border-radius: 2px; background: currentColor;
                      height: calc(3px + var(--lvl, 0) * var(--k) * 13px); transition: height .06s linear; }
  .speaker.live { background: var(--hi); color: var(--hi-ink); border-color: var(--hi); }
  .speaker.live .meter { display: inline-flex; }
  .hint { font-size: 13px; color: var(--muted); padding: 4px 22px 14px; margin: 0; }

  .turns { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 12px; border-top: 1px solid var(--line); }
  .turn { position: relative; padding: 12px 40px 12px 10px; border-radius: 12px; }
  .turn + .turn { border-top: 1px solid var(--line); border-radius: 0; }
  .turn .who { font-size: 13px; font-weight: 620; display: flex; gap: 10px; align-items: baseline; }
  .turn .who time { font-weight: 400; color: var(--muted); }
  .turn .what { outline: none; margin-top: 2px; color: var(--ink); border-radius: 6px; }
  .turn .what:focus { box-shadow: 0 0 0 1.5px var(--ink); }
  .turn.pending .what { color: var(--muted); }
  .turn.pending .what::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px;
                               border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .del { position: absolute; top: 10px; right: 6px; width: 28px; height: 28px; border-radius: 50%;
         border: 0; background: none; color: var(--muted); cursor: pointer; opacity: 0; font-size: 15px; }
  .turn:hover .del, .item:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: var(--soft); color: var(--ink); }
  .empty { margin: auto; max-width: 300px; text-align: center; color: var(--muted); font-size: 14px; padding: 40px 12px; }
  .empty strong { display: block; color: var(--ink); font-weight: 580; font-size: 15px; margin-bottom: 4px; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
  .btn { height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel);
         cursor: pointer; font-weight: 520; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--hi); color: var(--hi-ink); border-color: var(--hi); }
  .btn.primary:hover { opacity: .86; }
  .btn.ghost { border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--line-2); }
  .btn:disabled { opacity: .4; cursor: default; }
  .bar .push { margin-left: auto; }

  /* ---------- action items ---------- */
  .notes { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  .cols, .item { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.6fr) minmax(0, 1.1fr) 32px; gap: 8px; }
  .cols { padding: 12px 22px 8px; font-size: 12.5px; color: var(--muted); }
  .item { position: relative; padding: 8px 22px 8px 22px; border-top: 1px solid var(--line); align-items: start; }
  .item.flagged::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
                          border-radius: 0 3px 3px 0; background: var(--ink); }
  .item input { width: 100%; height: 34px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 0 8px; }
  .item textarea { width: 100%; min-height: 34px; border: 1px solid transparent; background: transparent; border-radius: 8px;
                   padding: 6px 8px; resize: none; field-sizing: content; line-height: 1.45; overflow: hidden; }
  .item input:hover, .item textarea:hover { border-color: var(--line); }
  .item textarea:focus { outline: none; border-color: var(--ink); background: var(--panel); }
  .item input:focus { outline: none; border-color: var(--ink); background: var(--panel); }
  .item input.owner { font-weight: 580; }
  .item input.unassigned { border: 1px dashed var(--line-2); color: var(--ink-2); font-weight: 520; letter-spacing: .02em; }
  .item .del { position: static; width: 32px; height: 32px; }
  .flags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px 4px; }
  .flag { font-size: 12.5px; color: var(--ink-2); background: var(--soft); border-radius: 999px; padding: 2px 10px; }
  .flag::before { content: "Check: "; color: var(--ink); font-weight: 580; }

  .missed { margin: 18px 22px; padding: 16px 18px; border: 1px dashed var(--line-2); border-radius: 16px; }
  .missed h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .missed > p { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
  .need { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .need span { flex: 1; } .need strong { font-weight: 600; margin-right: 6px; }
  .need .btn { height: 32px; padding: 0 14px; font-size: 13px; }
  details { margin: 0 22px 18px; font-size: 13px; color: var(--muted); }
  details pre { white-space: pre-wrap; font-size: 12.5px; }
  .err { margin: 22px; padding: 14px 16px; border: 1px solid var(--rec); border-radius: 12px; font-size: 14px; }
  .err strong { display: block; margin-bottom: 2px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 8px); background: var(--hi); color: var(--hi-ink);
           padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s;
           pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    header { padding: 12px 16px; }
    main { grid-template-columns: minmax(0, 1fr); padding: 0 16px 16px; }
    .panel { min-height: 70vh; }
  }
  @media (max-width: 560px) {
    .cols { display: none; }
    .item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 32px; }
    .item .task { grid-column: 1 / -1; grid-row: 2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i></div>
    <div>
      <h1>Meeting Assistant</h1>
      <p>Runs on this laptop. Audio and notes never leave it.</p>
    </div>
  </div>
  <label class="control" title="Model server">
    <span id="health" class="status" aria-label="checking model server"></span>
    <select id="backend" aria-label="Model"></select>
  </label>
  <div class="theme" role="group" aria-label="Theme">
    <button data-theme="light">Light</button><button data-theme="system">Auto</button><button data-theme="dark">Dark</button>
  </div>
</header>

<main>
  <section class="panel" id="left">
    <div class="panel-head">
      <h2>Transcript</h2>
      <div class="aside"><span class="rec-clock num" id="clock">0:00</span><span id="speechState">Loading speech model</span></div>
    </div>
    <div class="speakers" id="speakers"></div>
    <p class="hint">Click your name and speak. Click it again to stop, or click the next speaker.</p>
    <div class="turns" id="turns"></div>
    <div class="bar">
      <button class="btn primary" id="extract">Extract action items</button>
      <button class="btn ghost" id="open">Open transcript</button>
      <input type="file" id="file" accept=".txt" hidden>
      <button class="btn ghost push" id="clear">Clear</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Action items</h2>
      <div class="aside num" id="notesMeta"></div>
    </div>
    <div class="notes" id="notes"></div>
    <div class="bar">
      <button class="btn" id="copy" disabled>Copy as Markdown</button>
      <button class="btn" id="save" disabled>Save</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { turns: [], result: null, live: null, rec: null, start: null };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), ms);
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

// ---------- theme: light / auto / dark, remembered on this browser ----------
function setTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = t;
  document.querySelectorAll(".theme button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === t));
  try { localStorage.setItem("theme", t); } catch {}
}
document.querySelectorAll(".theme button").forEach((b) => b.onclick = () => setTheme(b.dataset.theme));
try { setTheme(localStorage.getItem("theme") || "system"); } catch { setTheme("system"); }

// ---------- setup ----------
async function init() {
  const cfg = await api("/api/config");
  for (const [name, b] of Object.entries(cfg.backends)) {
    const o = new Option(`${name} — ${b.note}`, name); if (name === cfg.default_backend) o.selected = true;
    $("backend").add(o);
  }
  cfg.participants.forEach(addSpeaker);
  $("backend").onchange = checkHealth;
  checkHealth(); renderTurns(); renderNotes();
  // warm the speech model so the first turn isn't slow
  const blank = new Float32Array(16000).buffer;
  api("/api/transcribe", { method: "POST", body: blank }).then(() => $("speechState").textContent = "Speech model ready")
    .catch(() => $("speechState").textContent = "Speech model failed to load");
}

async function checkHealth() {
  const h = await api("/api/health"), b = h[$("backend").value], dot = $("health");
  dot.className = "status " + (b.ok ? "ok" : "down");
  dot.setAttribute("aria-label", b.ok ? "model server running" : "model server not running");
  dot.parentElement.title = b.ok ? "Model server running" : b.message;
  if (!b.ok) toast(b.message, 6000);
}

function addSpeaker(name) {
  const b = document.createElement("button");
  b.className = "speaker";
  b.innerHTML = `<span class="meter" aria-hidden="true">${[.5, .9, 1.3, .8, .55].map((k) => `<b style="--k:${k}"></b>`).join("")}</span>${esc(name)}`;
  b.onclick = () => toggle(name, b);
  $("speakers").append(b);
}

// ---------- recording: raw PCM via Web Audio, resampled to 16 kHz in the browser ----------
async function toggle(name, btn) {
  const was = state.live;
  if (state.rec) await stopTurn();
  if (was !== name) await startTurn(name, btn);
}

async function startTurn(name, btn) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = (e) => {
      const x = e.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(x));
      let sum = 0; for (let i = 0; i < x.length; i += 16) sum += x[i] * x[i];
      btn.style.setProperty("--lvl", Math.min(1, Math.sqrt(sum / (x.length / 16)) * 6).toFixed(2));  // mic level
    };
    src.connect(proc); proc.connect(ctx.destination);
    const t0 = Date.now();
    state.start ??= t0;
    state.rec = { stream, ctx, proc, chunks, btn, t0, at: (t0 - state.start) / 1000,
                  tick: setInterval(() => $("clock").textContent = mmss((Date.now() - t0) / 1000), 250) };
    state.live = name;
    $("clock").textContent = "0:00";
    btn.classList.add("live"); btn.setAttribute("aria-pressed", "true"); $("left").classList.add("recording");
  } catch (e) { toast("Microphone not available: " + e.message, 5000); }
}

async function stopTurn() {
  const { stream, ctx, proc, chunks, btn, tick, at } = state.rec, name = state.live;
  proc.disconnect(); stream.getTracks().forEach((t) => t.stop()); clearInterval(tick);
  const audio = resample(chunks, ctx.sampleRate, 16000);
  await ctx.close();
  btn.classList.remove("live"); btn.removeAttribute("aria-pressed"); btn.style.removeProperty("--lvl");
  $("left").classList.remove("recording");
  state.rec = null; state.live = null;
  if (audio.length < 3200) return;               // under 0.2 s: a click
  const turn = { speaker: name, text: "Transcribing", pending: true, at };
  state.turns.push(turn); renderTurns();         // placeholder keeps turns in speaking order
  try {
    const r = await api("/api/transcribe", { method: "POST", body: audio.buffer });
    turn.text = r.text || "(nothing heard)"; turn.pending = false;
  } catch (e) { turn.text = "(transcription failed: " + e.message + ")"; turn.pending = false; }
  renderTurns();
}

function resample(chunks, from, to) {
  const n = chunks.reduce((a, c) => a + c.length, 0), input = new Float32Array(n);
  let o = 0; for (const c of chunks) { input.set(c, o); o += c.length; }
  const ratio = from / to, out = new Float32Array(Math.floor(n / ratio));
  for (let i = 0; i < out.length; i++) {          // average the samples each output sample covers
    const s = Math.floor(i * ratio), e = Math.min(n, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = s; j < e; j++) sum += input[j];
    out[i] = sum / Math.max(1, e - s);
  }
  return out;
}

// ---------- transcript ----------
function renderTurns() {
  const box = $("turns");
  if (!state.turns.length) {
    box.innerHTML = '<div class="empty"><strong>No one has spoken yet</strong>Pick a name above to record a turn, or open a saved transcript.</div>';
    return;
  }
  box.innerHTML = "";
  state.turns.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "turn" + (t.pending ? " pending" : "");
    row.innerHTML = `<div class="who">${esc(t.speaker)}${t.at != null ? `<time class="num">${mmss(t.at)}</time>` : ""}</div>
      <div class="what" contenteditable="${!t.pending}" spellcheck="false">${esc(t.text)}</div>
      <button class="del" title="Delete turn" aria-label="Delete turn">✕</button>`;
    row.querySelector(".what").oninput = (e) => (t.text = e.target.textContent);
    row.querySelector(".del").onclick = () => { state.turns.splice(i, 1); renderTurns(); };
    box.append(row);
  });
  box.scrollTop = box.scrollHeight;
}

// the model sees plain "Name: text" lines, exactly like the eval transcripts
const transcriptText = () => state.turns.filter((t) => !t.pending).map((t) => `${t.speaker}: ${t.text.trim()}`).join("\n");

$("open").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const text = await e.target.files[0].text();
  state.turns = text.split(/\r?\n/).map((l) => l.match(/^\s*([A-Z][\w .'-]{0,30}):\s*(.+)$/))
    .filter(Boolean).map((m) => ({ speaker: m[1], text: m[2] }));
  state.start = null; renderTurns(); e.target.value = "";
  toast(`Opened ${state.turns.length} turns`);
};
$("clear").onclick = () => {
  if (state.turns.length && confirm("Clear the transcript?")) { state.turns = []; state.start = null; renderTurns(); }
};

// ---------- action items ----------
$("extract").onclick = async () => {
  const transcript = transcriptText();
  if (!transcript) return toast("Record or open a transcript first.");
  const btn = $("extract"), t0 = Date.now(), backend = $("backend").value;
  btn.disabled = true;
  const tick = () => btn.textContent = `Extracting ${Math.floor((Date.now() - t0) / 1000)} s`;
  tick(); const h = setInterval(tick, 500);
  $("notesMeta").textContent = `${backend}, thinking off`;
  try {
    state.result = await api("/api/notes", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ transcript, backend }) });
    renderNotes();
  } catch (e) {
    $("notes").innerHTML = `<div class="err"><strong>Extraction failed</strong>${esc(e.message)}</div>`;
    $("notesMeta").textContent = "";
  } finally { clearInterval(h); btn.disabled = false; btn.textContent = "Extract action items"; }
};

function renderNotes() {
  const r = state.result, box = $("notes");
  if (!r) {
    box.innerHTML = '<div class="empty"><strong>No action items yet</strong>Extract them from the transcript. Rows marked with a bar need a quick check.</div>';
    return;
  }
  const n = r.items.length;
  $("notesMeta").innerHTML = `<span>${n} item${n === 1 ? "" : "s"}</span><span>${r.seconds.toFixed(0)} s on ${esc(r.backend)}</span>`;
  const rows = r.items.map((it, i) => `
    <div class="item${it.flags.length ? " flagged" : ""}">
      <input class="owner${it.owner.toUpperCase() === "UNASSIGNED" ? " unassigned" : ""}" data-i="${i}" data-k="owner" value="${esc(it.owner)}" aria-label="Owner">
      <textarea class="task" rows="1" data-i="${i}" data-k="task" aria-label="Task">${esc(it.task)}</textarea>
      <input class="deadline" data-i="${i}" data-k="deadline" value="${esc(it.deadline)}" aria-label="Deadline">
      <button class="del" data-del="${i}" title="Delete item" aria-label="Delete item">✕</button>
      ${it.flags.length ? `<div class="flags">${it.flags.map((f) => `<span class="flag">${esc(f.replace(/: check$/, ""))}</span>`).join("")}</div>` : ""}
    </div>`).join("");
  let html = n ? `<div class="cols"><span>Owner</span><span>Task</span><span>Deadline</span></div>${rows}`
               : '<div class="empty"><strong>No action items found</strong>Nobody committed to a task in this transcript.</div>';
  if (r.missed.length) {
    html += `<div class="missed"><h3>Possibly missed</h3><p>Someone said this was needed, but no item covers it.</p>` +
      r.missed.map((m, i) => `<div class="need"><span><strong>${esc(m.speaker)}</strong>“${esc(m.sentence)}”</span><button class="btn" data-add="${i}">Add as item</button></div>`).join("") + `</div>`;
  }
  if (r.rejected.length) html += `<details><summary>${r.rejected.length} line(s) the model wrote that are not items</summary><pre>${esc(r.rejected.join("\n"))}</pre></details>`;
  box.innerHTML = html;
  box.querySelectorAll("[data-i]").forEach((inp) => inp.oninput = () => {
    r.items[inp.dataset.i][inp.dataset.k] = inp.value;
    if (inp.dataset.k === "owner") inp.classList.toggle("unassigned", inp.value.trim().toUpperCase() === "UNASSIGNED");
  });
  box.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { r.items.splice(+b.dataset.del, 1); renderNotes(); });
  box.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => {
    const m = r.missed.splice(+b.dataset.add, 1)[0];
    r.items.push({ owner: "UNASSIGNED", task: m.sentence, deadline: "NONE", flags: [`added from what ${m.speaker} said; set an owner`] });
    renderNotes();
  });
  $("copy").disabled = $("save").disabled = false;
}

function markdown() {
  const r = state.result;
  const L = ["| owner | task | deadline | check |", "|---|---|---|---|",
    ...r.items.map((it) => `| ${it.owner} | ${it.task} | ${it.deadline} | ${it.flags.join("; ")} |`)];
  if (r.missed.length) L.push("", "Possibly missed:", ...r.missed.map((m) => `- ${m.speaker}: "${m.sentence}"`));
  return L.join("\n");
}
$("copy").onclick = async () => { await navigator.clipboard.writeText(markdown()); toast("Copied as Markdown"); };
$("save").onclick = async () => {
  try {
    const r = await api("/api/save", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ transcript: transcriptText(), result: state.result }) });
    toast("Saved to " + r.folder, 4000);
  } catch (e) { toast("Save failed: " + e.message, 5000); }
};

init();
</script>
</body>
</html>
